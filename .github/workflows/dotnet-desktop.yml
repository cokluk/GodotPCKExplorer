name: Build releases

on:
  push:
    branches: [master, main]
    tags: ["v*", "*.*.*"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/util_*"
      - "Images/**"
      - "HexEditorStructures/**"
  pull_request:
    branches: [master, main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".github/**"
      - "Images/**"
      - "HexEditorStructures/**"
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build all packages
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Zip packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path upload | Out-Null
          Get-ChildItem build -Directory | ForEach-Object {
            $zip = Join-Path upload "$($_.Name).zip"
            if (Test-Path $zip) { Remove-Item $zip -Force }
            Compress-Archive -Path "$($_.FullName)\*" -DestinationPath $zip
            Write-Host $zip
          }

      - uses: actions/upload-artifact@v4
        with:
          name: release-zips
          path: upload/*.zip
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-zips
          path: upload

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: upload/*.zip
          fail_on_unmatched_files: true
